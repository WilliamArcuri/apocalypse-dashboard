<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title description">
  <title id="title">Apocalypse</title>
  <desc id="description">A champagne-gold geometric A monogram on an obsidian rounded square.</desc>
  <defs>
    <linearGradient id="obsidian" x1="42" y1="24" x2="258" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#252A32"/>
      <stop offset="0.46" stop-color="#11151B"/>
      <stop offset="1" stop-color="#07090D"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(72 42) rotate(47) scale(230)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E3C985" stop-opacity="0.15"/>
      <stop offset="0.58" stop-color="#E3C985" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#E3C985" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="86" y1="78" x2="222" y2="228" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1E0B4"/>
      <stop offset="0.45" stop-color="#D7BC7C"/>
      <stop offset="1" stop-color="#9E7E45"/>
    </linearGradient>
    <linearGradient id="edge" x1="34" y1="28" x2="265" y2="278" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0D99E" stop-opacity="0.5"/>
      <stop offset="0.42" stop-color="#D7BC7C" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#D7BC7C" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="monogram-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="284" height="284" rx="76" fill="url(#obsidian)"/>
  <rect x="8" y="8" width="284" height="284" rx="76" fill="url(#ambient)"/>
  <rect x="9.5" y="9.5" width="281" height="281" rx="74.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <rect x="19" y="19" width="262" height="262" rx="66" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="2"/>

  <g fill="none" stroke="url(#metal)" stroke-linecap="round" stroke-linejoin="round" filter="url(#monogram-shadow)">
    <path d="M72 226 135 72c5.8-14.2 24.2-14.2 30 0l63 154" stroke-width="20"/>
    <path d="M104 178h92" stroke-width="17"/>
  </g>
